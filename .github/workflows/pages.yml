# Build the iHRIS-themed harness site (src/tools/build_site.py) and publish it on the
# gh-pages branch, served at https://litlfred.github.io/ihris/.
# The owner sets it once: Settings -> Pages -> Source: Deploy from a branch -> gh-pages / (root).
# gh-pages holds build output only. Never edit it by hand; change the generator.
#
# Every page carries the folio chrome (the C@T harness rail, icon row, Folio glass and
# scheme switch), added AFTER the build by cat-harness's own rail-standalone-pages.ts in
# --foreign-site mode, the step folio-assistant's folio-staging.yml runs for a folio's own
# Pages site. The rail's data is written beside the pages; its navbar.js/css and
# docs-ui.js/css load from the platform's published site. The platform is mounted from
# index.lock.json first (src/tools/mount_platform.sh).
#
# STAGING, as folio-staging.yml does it: every pull request from this repository gets a
# preview at https://litlfred.github.io/ihris/STAGING/<branch-slug>/, carrying
# cat-harness's staging banner (staging-banner.ts) so it can never be mistaken for the
# live site. Each push REPLACES that preview; closing the PR removes it. Publishing main
# replaces everything at the root EXCEPT STAGING/ and ihris5/ (the iHRIS 5 IG, from ihris5-ig.yml).
name: pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "library/**"
      - "glossary/**"
      - "ihris.json"
      - "index.config.json"
      - "index.lock.json"
      - ".github/workflows/pages.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # A fork's PR has no write token; its preview is not built here.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Where this build goes (the root for main, STAGING/<slug>/ for a pull request)
        id: target
        # The branch name is data, never parsed as program, and the slug is checked by VALUE
        # (as in folio-staging.yml): an empty slug would name STAGING/ itself.
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SLUG=$(echo "$HEAD_REF" | sed 's|[^a-zA-Z0-9._-]|-|g' | sed 's|--*|-|g' | sed 's|^-||;s|-$||')
            case "$SLUG" in ""|.|..) echo "::error::staging slug resolved to '$SLUG'. Refusing."; exit 1 ;; esac
            echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
            echo "branch=$HEAD_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: oven-sh/setup-bun@v2
      - name: Mount folio-assistant-core and its closure from index.lock.json, then bun install
        run: bash src/tools/mount_platform.sh
      - name: Install the site build's pinned dependencies
        run: pip install -r src/tools/requirements-site.txt
      - name: Verify the committed theme (the tarball is not in git; logo sha256 only)
        run: python3 src/tools/extract_theme.py --check
      - name: Build the site and check every internal link
        run: python3 src/tools/build_site.py --out _site --check-links
      - name: Add the folio chrome to every page (cat-harness rail, foreign-site mode, scoped to ihris)
        # The mounted cat-harness carries the PLATFORM's harness list (smart-base, smart-trust, ...).
        # sync-docs-harness.ts regenerates it from THIS checkout (index.config.json: ihris and what it
        # mounts), so --instance ihris lists ihris and the harnesses it needs, and nothing else.
        # It rewrites cat-harness/docs/_data/harness.json in this throwaway CI mount only.
        run: |
          bun run cat-harness/scripts/sync-docs-harness.ts
          bun run cat-harness/scripts/rail-standalone-pages.ts --site _site --built cat-harness --foreign-site --home-label "iHRIS Knowledge Base" --instance ihris
      - name: Staging banner (pull requests only)
        if: steps.target.outputs.slug != ''
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bun run cat-harness/scripts/staging-banner.ts \
            --site _site \
            --branch "$BRANCH" \
            --sha "${SHA:0:7}" \
            --built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --pr "$PR" \
            --pr-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR}" \
            --branch-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${BRANCH}" \
            --issues-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --main-site "https://litlfred.github.io/ihris" \
            --before-ref main
      - name: Commit the build to gh-pages
        env:
          SRC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SLUG: ${{ steps.target.outputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin gh-pages; then
            git worktree add ghp FETCH_HEAD
            git -C ghp checkout -B gh-pages
          else
            git worktree add --orphan -b gh-pages ghp
          fi
          if [ -n "$SLUG" ]; then
            # REPLACE this branch's preview, never overlay it, except the iHRIS 5 IG that
            # ihris5-ig.yml builds into it (ihris5/).
            mkdir -p "ghp/STAGING/$SLUG"
            find "ghp/STAGING/$SLUG" -mindepth 1 -maxdepth 1 ! -name ihris5 -exec rm -rf {} +
            cp -r _site/. "ghp/STAGING/$SLUG/"
            MSG="Stage ${SLUG} (build_site.py @ ${SRC_SHA::7})"
            URL="https://litlfred.github.io/ihris/STAGING/$SLUG/"
          else
            # The live site: everything at the root is replaced, except the open previews and the
            # iHRIS 5 IG, which ihris5-ig.yml builds and publishes (ihris5/).
            find ghp -mindepth 1 -maxdepth 1 ! -name .git ! -name STAGING ! -name ihris5 -exec rm -rf {} +
            cp -r _site/. ghp/
            MSG="Publish the ihris site (build_site.py @ ${SRC_SHA::7})"
            URL="https://litlfred.github.io/ihris/"
          fi
          echo "Site: $URL" >> "$GITHUB_STEP_SUMMARY"
          git -C ghp add -A
          if git -C ghp diff --cached --quiet; then
            echo "gh-pages already up to date"
            exit 0
          fi
          git -C ghp commit -m "$MSG"
          for _ in 1 2 3; do
            git -C ghp push origin gh-pages && break
            git -C ghp pull --rebase origin gh-pages
          done
          echo "Published: $URL"

  unstage:
    # The PR is closed or merged: its preview goes. A fork's PR never had one.
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Remove STAGING/<slug>/
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          SLUG=$(echo "$HEAD_REF" | sed 's|[^a-zA-Z0-9._-]|-|g' | sed 's|--*|-|g' | sed 's|^-||;s|-$||')
          case "$SLUG" in ""|.|..) echo "::error::staging slug resolved to '$SLUG'. Refusing."; exit 1 ;; esac
          if [ ! -d "STAGING/$SLUG" ]; then echo "no preview at STAGING/$SLUG"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq "STAGING/$SLUG"
          git commit -m "Unstage ${SLUG} (PR closed)"
          git push origin HEAD:gh-pages
