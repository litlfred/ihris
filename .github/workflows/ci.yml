# CI on EVERY commit: every push to any branch, and every pull request.
# Owner, 2026-09-23: "make sure that part of process of every commit is CI process".
#
# It runs src/tools/validate.py, the same command AGENTS.md §3 asks for before a
# commit. That covers:
#   - JSON Schema for every ihris document, and a failure on any JSON file no schema covers
#   - folio-assistant's own zod: catalogues, declarations, config, beans graph, skill
#     package, Tool nodes, pdf-structure/v1, methodology front matter, and the platform
#     dependency itself (index.config.json, index.lock.json)
#   - FHIR R4 terminology (fhir.resources, in its own venv)
#   - the generated FSH, built clean by a pinned SUSHI, and the terminology JSON equal to that build
#   - semantic QA for every schema and node type (src/tools/qa.py), where a schema
#     with no QA is itself a failure (qa-missing)
#   - generated BPMN is current; the site theme is current; the site builds with no broken link
# and first lints the workflow files themselves (actionlint).
#
# ihris is a folio-assistant-core DEPENDENT repository (as litlfred/who-iris is): the
# platform layers are mounted at <name>/ from the committed index.lock.json, each at its
# pinned SHA and verified against the lock's tree digest, by src/tools/mount_platform.sh
# (cat-harness's own mount-from-lock.ts). They are git-ignored, and validate.py and qa.py
# skip them (src/tools/folio_platform.py), so the platform's files are never validated as
# this folio's. Before the cutover this cloned litlfred/folio-assistant main, which no
# longer holds the layers in its tree.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint the workflows themselves (a broken workflow file fails before any check runs)
        run: |
          pip install actionlint-py
          actionlint .github/workflows/*.yml
      - uses: oven-sh/setup-bun@v2
      - name: Python dependencies
        run: |
          pip install jsonschema openpyxl "pycountry==24.6.1" pyyaml
          pip install -r src/tools/requirements-site.txt
      - name: FHIR R4 validator (its own venv; fhir.resources 6.x needs pydantic<2)
        run: |
          python3 -m venv .build/fhir-venv
          .build/fhir-venv/bin/pip install "fhir.resources==6.5.0" "pydantic<2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: SUSHI, pinned (src/tools/gen_fsh.py builds the FSH with it)
        run: npm install -g fsh-sushi@3.20.1
      - uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('src/ihris-4-on-fhir/sushi-config.yaml') }}
          restore-keys: fhir-packages-
      - name: Mount folio-assistant-core and its closure from index.lock.json, then bun install
        run: bash src/tools/mount_platform.sh
      - name: validate.py (schemas, zod, FHIR, QA coverage, BPMN, theme, site)
        run: python3 src/tools/validate.py
